name: CI

on:
  push:
    branches: [ v2.6.4-miint, library-api, GoogleImport, master ]
  pull_request:
    branches: [ v2.6.4-miint, library-api, GoogleImport, master ]
  workflow_dispatch:

jobs:

  # ── Linux ──────────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Build CLI + library
        run: make CC=${{ matrix.cc }}

      - name: Build static library
        run: make libprodigal.a CC=${{ matrix.cc }}

      - name: Build and run tests
        run: make test CC=${{ matrix.cc }}

      - name: CLI regression (every output type, both modes)
        run: make regress CC=${{ matrix.cc }}

  # ── macOS ──────────────────────────────────────────────────────────────────
  # On ARM64 make regress skips the training-file byte compare (docs/testing.md).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CLI + library
        run: make

      - name: Build and run tests
        run: make test

      - name: CLI regression (every output type, both modes)
        run: make regress

  # ── Determinism experiment (report only; docs/testing.md) ─────────────────
  # ARM64 builds, default and -ffp-contract=off, byte-compared with the x86-64
  # ground truth. Results go to the job summary. Never gates.
  determinism:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, cc: clang }
          - { os: ubuntu-24.04-arm, cc: gcc }
          - { os: ubuntu-24.04-arm, cc: clang }
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Compare against the x86-64 ground truth
        env:
          CC: ${{ matrix.cc }}
          RUNNER: ${{ matrix.os }}
        run: |
          set +e
          mkdir -p tests/out
          echo "| runner | cc | flags | result |" >>"$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >>"$GITHUB_STEP_SUMMARY"
          for flags in "" "-ffp-contract=off"; do
            label=${flags:-default}
            out=tests/out/determinism-${label#-}
            # training.o holds only constant data, so the flag cannot change
            # it; keep it rather than recompile 25 MB of initialisers.
            find . -maxdepth 1 -name '*.o' ! -name training.o -delete
            rm -f prodigal
            CFLAGS="$flags" make CC="$CC" >/dev/null
            # The script, not make regress: make would turn 1 and 2 into 2.
            REGRESS_OUT=$out tests/cli_regress.sh --binary | tee "$out.log"
            case ${PIPESTATUS[0]} in
              0) result=match ;;
              1) result="differs: $(awk '/^(DIFF|FAIL)/ {printf "%s ", $2}' "$out.log")" ;;
              *) result="setup error" ;;
            esac
            echo "| $RUNNER | $CC | $label | $result |" >>"$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: determinism-${{ matrix.os }}-${{ matrix.cc }}
          path: tests/out/

  # ── WASM (library only, via Emscripten) ────────────────────────────────────
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Build library with emcc
        run: |
          CORE="bitmap.c dprog.c gene.c metagenomic.c node.c sequence.c training.c prodigal_api.c"
          emcc -O3 -Wall -DPRODIGAL_NO_MAIN -c $CORE
          emar rcs libprodigal.a *.o
          echo "WASM library build succeeded"

      - name: Build and run test suite in Node.js
        run: |
          CORE="bitmap.c dprog.c gene.c metagenomic.c node.c sequence.c training.c prodigal_api.c"
          emcc -O3 -Wall -DPRODIGAL_NO_MAIN $CORE test_api.c -o test_api.js \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=134217728 \
            -lm
          node test_api.js

  # ── Windows (MSYS2/MinGW-w64) ─────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make mingw-w64-ucrt-x86_64-zlib diffutils

      - name: Build CLI + library
        run: make

      - name: Build and run tests
        run: make test

      - name: CLI regression (every output type, both modes)
        run: make regress
